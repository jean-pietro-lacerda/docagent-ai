[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docagent-ai"
version = "1.0.0"
description = "Backend foundation for DocAgent AI"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=25.1,<26.0",
    "alembic>=1.16,<2.0",
    "fastapi>=0.115,<1.0",
    "langgraph>=1.2.20,<2.0",
    "pgvector>=0.4,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.10,<3.0",
    "pymupdf>=1.26,<2.0",
    "pyjwt>=2.10,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
embeddings = [
    "numpy>=2.3,<3.0",
    "onnxruntime>=1.23,<2.0",
    "tokenizers>=0.22,<1.0",
    "huggingface-hub>=1.0,<2.0",
]
test = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["app"]
